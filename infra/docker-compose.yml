version: '3.9'

services:

  postgres:
    image: postgres:17
    container_name: pathpulse-postgres

    environment:
      POSTGRES_DB: pathpulse
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: kanishk

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pathpulse-redis

    ports:
      - "6379:6379"

volumes:
  postgres_data: